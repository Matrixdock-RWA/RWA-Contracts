[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
# https://rareskills.io/post/rust-arithmetic-operators#arithmetic-overflow
overflow-checks = true
