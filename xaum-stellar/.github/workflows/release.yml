name: Build and Release  # name it whatever you like
on:
  push:
    tags:
      - 'v*'  # triggered whenever a new tag (previxed with "v") is pushed to the repository

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract-xaum:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'XAUm contract release'
      package: 'xaum'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-minter:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Minter Contract release'
      package: 'minter'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
